<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Exercise">
  <!-- the page -->
  <rect x="9" y="5" width="36" height="48" fill="none" stroke="#141210" stroke-width="3" stroke-linejoin="miter"/>
  <!-- band 1: solid -->
  <rect x="15" y="11" width="24" height="7" fill="none" stroke="#141210" stroke-width="2"/>
  <!-- band 2: dashed (added by the app, invisible to you) -->
  <rect x="15" y="22" width="24" height="7" fill="none" stroke="#141210" stroke-width="2" stroke-dasharray="3 2.1667" stroke-dashoffset="1.5"/>
  <!-- band 3: solid -->
  <rect x="15" y="33" width="24" height="5" fill="none" stroke="#141210" stroke-width="2"/>
  <!-- the prompt: thin orange band -->
  <rect x="15" y="42" width="24" height="5" fill="#F26B28"/>
  <!-- click marks -->
  <g stroke="#F26B28" stroke-width="2.5" stroke-linecap="square">
    <line x1="46" y1="39" x2="50" y2="36"/>
    <line x1="47" y1="44" x2="52" y2="44"/>
    <line x1="42" y1="35" x2="43" y2="31"/>
  </g>
  <!-- cursor -->
  <path d="M36 42 L36 61 L40.6 56.6 L44 63.5 L47.4 62 L44.1 55.2 L50.5 55.2 Z"
        fill="#141210" stroke="#F5EFE4" stroke-width="2" stroke-linejoin="miter"/>
</svg>
